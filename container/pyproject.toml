[project]
name = "xrd"
version = "1.4"
description = "XRD"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "rdetoolkit==1.7.1",
    "contourpy==1.1.0",
    "cycler==0.11.0",
    "fonttools==4.42.1",
    "kiwisolver==1.4.5",
    "pillow==10.4.0",
    "plotly==6.3.1",
    "pydantic-xml==2.9.0",
    "pyparsing==3.1.1",
    "requests>=2.32.5",
    "scipy==1.13.0",
    "types-pyyaml==6.0.12.20240311",
    "xlrd==2.0.1",
]

[project.optional-dependencies]
dev = [
    "ty>=0.0.24",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.2",
    "types-python-dateutil>=2.9.0.20260124",
]

[tool.pytest.ini_options]
pythonpath = ["container"]
testpaths = ["container/tests"]

[tool.ty.environment]
python-platform = "linux"
python-version = "3.12"
root = ["container"]

[tool.ty.analysis]
replace-imports-with-any = [
    "pandas.*",
    "numpy.*",
    "requests.*",
    "matplotlib.*",
    "scipy.*",
    "rdetoolkit.*",
]

[tool.ty.src]
exclude = [
    "**/data/**",           # RDEでの入出力
    "**/.venv/**",          # uv で作成された仮想環境
    "**/.git/**",
    "**/__pycache__/**",
    "**/.pytest_cache/**",
    "**/.ruff_cache/**",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "F",    # pyflakes
    "E",    # pycodestyle
    "W",    # pycodestyle warnings
    "I",    # isort
    "D",    # pydocstyle
    "N",    # pep8-naming
    "PL",   # Pylint,
    "C90",  # mccabe
    "UP",   # pyupgrade
    "ANN",  # flake8-annotations
    "S",    # flake8-bandit
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "COM",  # flake8-commas
    "C4",   # flake8-comprehensions
    "DTZ",  # flake8-datetimez
    "EM",   # flake8-errmsg
    "FA",   # flake8-future-annotations
    "ISC",  # flake8-implicit-str-concat
    "ICN",  # flake8-import-conventions
    "INP",  # flake8-no-pep420
    "PIE",  # flake8-pie
    "T10",  # flake8-debugger
    "T20",  # flake8-print
    "PYI",  # flake8-pyi
    "RSE",  # flake8-raise
    "RET",  # flake8-return
    "SLF",  # flake8-self
    "SLOT", # flake8-slots
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports
]
ignore = [
    "D100",
    "D101",
    "D104",
    "D105",
    "D107",
    "N805",
    "PLR0913",
    "S307",
    "ANN002",
    "ANN003",
    "ANN204",
    "ANN401",
    "BLE001",
]
exclude = [
    "bzr",
    ".direnv",
    ".eggs",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "bzr",
    "dist",
    "node_modules",
    "site-packages",
    "src",
    "venv",
    "tests_rde",
    "tests",
    "stubs",
]

[tool.ruff.lint.isort]
known-first-party = ["file_formats"]

[tool.coverage.run]
omit = ["tests/*"]

[tool.coverage.report]
# Regexes for lines to exclude from consideration
exclude_also = [
    # Don't complain about missing debug-only code:
    "def __repr__",
    "if self\\.debug",

    # Don't complain if tests don't hit defensive assertion code:
    "raise AssertionError",
    "raise NotImplementedError",

    # Don't complain if non-runnable code isn't run:
    "if 0:",
    'if __name__ == "__main__":',

    # Don't complain about abstract methods, they aren't run:
    "@(abc\\.)?abstractmethod",
]
